[package]
name = "zaw"
version = "0.1.1"
edition = "2024"
description = "A shielded Zcash wallet for AI agents, exposed over MCP"
license = "MIT"
repository = "https://github.com/Sofiia7/zec-agent-wallet"
publish = false

[dependencies]
age = "0.12"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bip0039 = { version = "0.14", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
hex = "0.4"
hmac = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rpassword = "7"
rusqlite = "0.37"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

# Zcash. Pinned exactly: these releases know the NU7 activation heights on
# testnet (active since 4 Oct 2026) and mainnet (height 3,543,405).
zcash_address = "=0.14.0"
zcash_client_backend = { version = "=0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard"] }
zcash_keys = { version = "=0.17.0", features = ["orchard"] }
zcash_primitives = "=0.31.0"
zcash_proofs = { version = "=0.31.0", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0"
zip32 = "0.3"
zip321 = "=0.10.0"

# Proof construction is unusably slow without optimisation; optimise dependencies
# even in dev builds.
[profile.dev.package."*"]
opt-level = 3
