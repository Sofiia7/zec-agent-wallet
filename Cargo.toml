[package]
name = "zaw"
version = "0.1.0"
edition = "2024"
description = "A shielded Zcash wallet for AI agents, exposed over MCP"
license = "MIT"
repository = "https://github.com/Sofiia7/zec-agent-wallet"
publish = false

[dependencies]
age = "0.12"
anyhow = "1"
async-trait = "0.1"
bip0039 = { version = "0.14", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
hex = "0.4"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
rusqlite = "0.37"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Zcash. Pre-releases are required: NU7 is active on testnet since 4 Oct 2026,
# and the latest stable releases do not know its activation height.
zcash_address = "=0.14.0-pre.2"
zcash_client_backend ={ version = "=0.25.0-pre.2", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "=0.23.0-pre.2", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.2", features = ["orchard"] }
zcash_primitives = "=0.31.0-pre.2"
zcash_proofs = { version = "=0.31.0-pre.2", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.1"
zip32 = "0.3"
zip321 = "=0.10.0-pre.2"
